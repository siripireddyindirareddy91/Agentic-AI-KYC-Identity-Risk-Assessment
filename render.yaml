services:
  - type: web
    name: sentinel-kyc-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
